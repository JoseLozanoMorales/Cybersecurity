<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/pages/factura-inline-1.css">
  <link rel="stylesheet" href="/css/csp-static.css">
  <link rel="stylesheet" href="/css/csp-runtime.css">
  <script src="/js/csp-style-runtime.js"></script>
</head>
<body>
<div class="invoice p-4 p-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-start invoice-header pb-3 mb-4">
        <div>
            <h3 id="inv-numero" class="mb-1">Factura</h3>
            <div class="text-muted">Fecha: <span id="inv-fecha"></span></div>
        </div>
        <!-- Botones a la derecha -->
        <div class="text-end d-flex justify-content-end gap-2">
            <a href="index.html" class="btn btn-primary">
                Regresar a la tienda
            </a>
            <a id="btn-pdf" class="btn btn-outline-secondary" target="_blank">
                Descargar PDF
            </a>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-12 col-md-6">
            <h6 class="mb-2">Cliente</h6>
            <div><strong id="inv-nombre"></strong></div>
            <div id="inv-correo"></div>
            <div id="inv-telefono"></div>
        </div>
        <div class="col-12 col-md-6">
            <h6 class="mb-2">Entrega</h6>
            <div id="inv-direccion"></div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-sm align-middle">
            <thead class="table-light">
            <tr>
                <th>Producto</th>
                <th class="text-end">Cant.</th>
                <th class="text-end">Precio</th>
                <th class="text-end">Subtotal</th>
                <th class="text-end">IVA</th>
                <th class="text-end">Total</th>
            </tr>
            </thead>
            <tbody id="inv-body"></tbody>
        </table>
    </div>

    <div class="d-flex justify-content-end mt-3">
        <div class="csp-s-45435946eaf3">
            <div class="d-flex justify-content-between">
                <span>Subtotal</span><strong id="tot-sub">$0.00</strong>
            </div>
            <div class="d-flex justify-content-between border-top pt-2 mt-2">
                <span>Total</span><strong id="tot-tot">$0.00</strong>
            </div>
        </div>
    </div>
</div>

<script src="/js/pages/factura-inline-1.js"></script>
</body>
</html>
