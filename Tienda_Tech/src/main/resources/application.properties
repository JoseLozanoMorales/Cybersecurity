spring.application.name=TiendaTechV18
spring.datasource.url=${TT_DATASOURCE_URL}
spring.datasource.username=${TT_DATASOURCE_USERNAME}
spring.datasource.password=${TT_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.proc.param_null_passing=true
app.upload-root=${APP_UPLOAD_ROOT:${user.dir}/uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
spring.jpa.properties.hibernate.default_schema=public
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${TT_MAIL_USERNAME}
spring.mail.password=${TT_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

otp.ttl-minutes=10
otp.length=6
otp.resend.cooldown-seconds=60
otp.rate.max-per-15min=3

auth.access.minutes=10
auth.absolute.hours=8
#auth.idle.ADMIN=1
#.idle.TRABAJADOR=10
#auth.idle.CLIENTE=0
auth.cookie.domain=localhost
auth.cookie.secure=false
auth.cookie.samesite=Lax
auth.jwt.secret=${AUTH_JWT_SECRET}
app.crypto.key=${APP_CRYPTO_KEY:${AUTH_JWT_SECRET}:aes-data-v1}
app.crypto.rsa.private-key=${APP_RSA_PRIVATE_KEY:}
app.crypto.rsa.public-key=${APP_RSA_PUBLIC_KEY:}


paypal.mode=sandbox
paypal.clientId=${PAYPAL_CLIENT_ID}
paypal.clientSecret=${PAYPAL_CLIENT_SECRET}
paypal.currency=USD


logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO


auth.idle.ADMIN=1
auth.idle.TRABAJADOR=1
auth.idle.CLIENTE=0

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.frontend.base-url=http://localhost:8080
