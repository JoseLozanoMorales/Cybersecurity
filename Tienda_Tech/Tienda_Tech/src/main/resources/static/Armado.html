<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armador de computadoras - TiendaTech</title>
    <style>
        /* ==========================================================================
           TiendaTech – MODO CLARO
           ========================================================================== */
        :root{
            /* Base */
            --bg-page:          #f5f5f5;
            --text:             #333;

            /* Header / Nav */
            --hdr-bg:           #6c6c6c;
            --hdr-text:         #000;
            --hdr-shadow:       rgba(0,0,0,.10);

            /* Search */
            --search-bg:        #ffffff;
            --search-text:      #1f2937;

            /* Footer */
            --footer-bg:        #6c757d;
            --footer-text:      #fff;
        }

        /* ===========================
           RESET + BASE
           =========================== */
        html, body { height:100%; margin:0; padding:0; }
        * { margin:0; padding:0; box-sizing:border-box; }

        /* Sticky footer layout */
        .page-container { min-height:100%; display:flex; flex-direction:column; }
        .content-wrap   { flex:1; }

        /* ======================
           HEADER (igual que original)
           ====================== */
        .header{
            background: var(--hdr-bg);
            padding: 1rem 2rem;
            display:flex; justify-content:space-between; align-items:center;
            box-shadow: var(--hdr-shadow);
        }

        .menu-toggle{
            background:none; border:none; color: var(--hdr-text);
            font-size:1.5rem; cursor:pointer; padding:.5rem;
        }

        /* ======================
           PC BUILDER CONTENT (exacto a la imagen)
           ====================== */
        .main-content {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Título principal */
        .page-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 2rem;
        }

        /* Sección de categorías de componentes */
        .components-section {
            background: #c8c8c8;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 1.5rem;

        }

        .components-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .component-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }

        .component-icon {
            width: 60px;
            height: 60px;
            background: #888;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            font-size: 24px;
            color: #333;
        }

        .component-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Sección de productos seleccionados */
        .selected-section {
            background: #c8c8c8;
            border-radius: 15px;
            padding: 2rem;
        }

        .selected-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .selected-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .buttons-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.3rem;
        }

        .info-btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0;
            justify-content: center;
            background: transparent;
            padding: 0;
        }

        .info-btn .info-text {
            background: white;
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid #ddd;
        }

        .component-icon { width:50px; height:50px; border-radius:8px; object-fit:contain; display:block; background:#c8c8c8; }

        .cart-btn {
            background: #1E88E5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.3rem 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 28px;
        }

        .cart-btn:hover {
            background: #1976D2;
        }



        /* Patitas del chip */
        .selected-icon::before,
        .selected-icon::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 8px;
            background: #333;
        }

        .selected-icon::before {
            left: -3px;
            top: 5px;
            box-shadow: 0 4px 0 #333, 0 8px 0 #333, 0 12px 0 #333, 0 16px 0 #333;
        }

        .selected-icon::after {
            right: -3px;
            top: 5px;
            box-shadow: 0 4px 0 #333, 0 8px 0 #333, 0 12px 0 #333, 0 16px 0 #333;
        }



        /* Segunda fila de productos seleccionados */
        .selected-grid-second {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header{ padding:10px 15px; }
            .search-container{ margin:0 15px; }
            .main-content{ padding:15px; }
            .footer-nav{ gap:20px; }

            .components-grid{
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }
            .selected-grid,
            .selected-grid-second{
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 576px) {
            .footer-nav{ flex-direction:column; gap:10px; }
            .components-grid{
                grid-template-columns: repeat(2, 1fr);
            }
            .selected-grid,
            .selected-grid-second{
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Tamaño de los iconos de la sección "Arma tu computador" */
        .components-section .component-icon{
            font-size: 50px;  /* antes 24px (aumenta el emoji) */
            display:flex; align-items:center; justify-content:center; /* asegura centrado */
        }

        .selected-section .component-icon{
            font-size: 50px;  /* antes 24px (aumenta el emoji) */
            display:flex; align-items:center; justify-content:center; /* asegura centrado */
        }
    </style>

    <!-- <link rel="stylesheet" href="style2.css"> -->
    <link id="themeStylesheet" rel="stylesheet"
          href="styleClaroMenu.css" data-light="styleClaroMenu.css"
          data-dark="styleOscuroMenu.css" />

    <script src="/js/auth-menu.js?v=4" defer></script>
</head>
<body>
<div class="page-container">
    <!-- Header -->
    <header class="header">
        <div class="logo">TiendaTech</div>
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Buscar...">
        </div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <!-- Modo oscuro -->
        <button id="themeToggle" class="theme-toggle"
                type="button" aria-pressed="false">
            <span class="ico">🌙</span><span class="txt">Oscuro</span>
        </button>

    </header>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- Menú Hamburguesa -->
    <nav class="hamburger-menu" id="hamburgerMenu">
        <button class="menu-close" onclick="closeMenu()">✕</button>
        <a href="index.html"   class="menu-item">Inicio</a>
        <a href="cuenta.html"  class="menu-item requires-auth">Cuenta</a>
        <a href="Carrito.html" class="menu-item requires-auth">Carrito</a>
        <a href="#"            class="menu-item">Cerrar sesión</a>
    </nav>

    <div class="content-wrap">
        <main class="main-content">
            <h1 class="page-title">Armador de computadoras</h1>

            <!-- Sección "Arma tu computador" -->
            <div class="components-section">
                <h2 class="section-title">Arma tu computador</h2>
                <!-- Reemplaza cada .component-item agregando data-cat -->
                <div class="components-grid">
                    <div class="component-item" data-cat="cpu">
                        <img src="/assets/Iconos/chit.png" class="component-icon">
                        <div class="component-name">Procesadores</div>
                    </div>
                    <div class="component-item" data-cat="gpu">
                        <img src="/assets/Iconos/TarjetaGrafica.png" class="component-icon">
                        <div class="component-name">Tarjetas gráficas</div>
                    </div>
                    <div class="component-item" data-cat="ram">
                        <img src="/assets/Iconos/Ram.png" class="component-icon">
                        <div class="component-name">Memoria RAM</div>
                    </div>
                    <div class="component-item" data-cat="cooling">
                        <img src="/assets/Iconos/Ventilador.png" class="component-icon">
                        <div class="component-name">Refrigeración</div>
                    </div>
                    <div class="component-item" data-cat="case">
                        <img src="/assets/Iconos/Case.png" class="component-icon">
                        <div class="component-name">Cubiertas</div>
                    </div>
                    <div class="component-item" data-cat="mobo">
                        <img src="/assets/Iconos/Motherboard.png" class="component-icon">
                        <div class="component-name">Placas madre</div>
                    </div>
                    <div class="component-item" data-cat="psu">
                        <img src="/assets/Iconos/FuenteDePoder.png" class="component-icon">
                        <div class="component-name">Fuente de poder</div>
                    </div>
                    <div class="component-item" data-cat="storage">
                        <img src="/assets/Iconos/Almacenamiento.png" class="component-icon">
                        <div class="component-name">Almacenamiento</div>
                    </div>
                    <div class="component-item" data-cat="periferico">
                        <img src="/assets/Iconos/Perifericos.png" class="component-icon">
                        <div class="component-name">Perifericos</div>
                    </div>

                </div>
            </div>

            <!-- Sección de productos seleccionados -->
            <div class="selected-section">
                <div class="selected-grid"></div>
                <div class="selected-grid-second"></div>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <nav class="footer-nav">
            <a href="index.html">Inicio</a>
            <a href="cuenta.html"  class="requires-auth">Cuenta</a>
            <a href="Carrito.html" class="requires-auth">Carrito</a>
        </nav>
    </footer>
</div>

<!-- UI básica -->
<script>
    function toggleMenu() {
        const menu = document.getElementById('hamburgerMenu');
        const overlay = document.getElementById('overlay');
        menu.classList.toggle('active');
        overlay.classList.toggle('active');
    }

    function closeMenu() {
        const menu = document.getElementById('hamburgerMenu');
        const overlay = document.getElementById('overlay');
        menu.classList.remove('active');
        overlay.classList.remove('active');
    }

    document.addEventListener('DOMContentLoaded', function() {
        const sliderLeft = document.querySelector('.slider-nav.left');
        const sliderRight = document.querySelector('.slider-nav.right');

        sliderLeft.addEventListener('click', function() { console.log('Slider: Anterior'); });
        sliderRight.addEventListener('click', function() { console.log('Slider: Siguiente'); });

        const carouselLeft = document.querySelector('.carousel-nav.left');
        const carouselRight = document.querySelector('.carousel-nav.right');

        carouselLeft.addEventListener('click', function() { console.log('Carrusel: Anterior'); });
        carouselRight.addEventListener('click', function() { console.log('Carrusel: Siguiente'); });

        document.querySelectorAll('.category-card').forEach(card => {
            card.addEventListener('click', function() {
                console.log('Categoría seleccionada:', this.textContent);
            });
        });

        const pcBuilderBtn = document.querySelector('.pc-builder-btn');
        if (pcBuilderBtn) {
            pcBuilderBtn.addEventListener('click', () => console.log('PC Builder: Ver más'));
        }

    });
</script>

<script>
    (()=>{

        // Ajusta estos IDs a los reales de tu tabla categoria
        const CAT_TO_ID = {
            storage:1, cpu:2, cooling:3, case:4, psu:5, gpu:6, ram:7,
            mobo:8, periferico:9
        };

        const API = {
            byCat:  id => `/api/busqueda/categoria/${id}`,           // ← BusquedaController
            img:    galId => `/api/galeria_v2/img/${galId}`,         // ← GaleriaV2Controller
            detailUrl: id => `informacion_producto.html?id=${encodeURIComponent(id)}&from=builder`
        };

        const grid1 = document.querySelector('.selected-grid');
        const grid2 = document.querySelector('.selected-grid-second');

        // Activa click/teclado en categorías (tus items son <div>)
        document.querySelectorAll('.components-grid .component-item').forEach(el=>{
            el.setAttribute('tabindex','0');
            el.setAttribute('role','button');
            el.addEventListener('click', ()=> loadCat(el.dataset.cat));
            el.addEventListener('keydown', ev=>{
                if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); el.click(); }
            });
        });

        async function loadCat(catKey){
            const catId = CAT_TO_ID[catKey];
            if(!catId){ console.warn('Falta mapeo para', catKey); return; }
            try{
                const r = await fetch(API.byCat(catId), { credentials:'include' });
                if(!r.ok) throw new Error(r.status);
                const data = await r.json();
                render(Array.isArray(data) ? data.slice(0,12) : []);
            }catch(e){
                console.error('Error cargando productos:', e);
                render([]);
            }
        }

        function render(list){
            const nodes = list.map(p=>{
                const id     = p.id ?? p.productoId;
                const nombre = p.nombre ?? 'Producto';
                const precio = Number(p.precio ?? p.preciounitario ?? 0);
                const marca  = p.marca ?? '';
                const imgId  = p.imagenId ?? p.imagen_id ?? p.portadaId ?? p.portada_id;
                const src    = imgId ? API.img(imgId) : '/img/placeholder.png';

                return `
        <div class="selected-item" data-id="${id}" title="${esc(nombre)}">
          <img src="${src}" class="component-icon" alt="${esc(nombre)}"
               onerror="this.onerror=null;this.src='/img/placeholder.png'">
          <div class="buttons-container">
            <button class="info-btn" data-action="info"><span class="info-text">Info</span></button>
            <button class="cart-btn" data-action="cart" title="Agregar al carrito">🛒</button>
          </div>
          <div class="product-name">${esc(nombre)}</div>
          <div class="product-price">${money(precio)}</div>
          <div class="product-brand" style="font-size:.8rem;color:#333">${esc(marca)}</div>
        </div>`;
            });

            while (nodes.length < 12) nodes.push('<div class="selected-item"></div>');
            grid1.innerHTML = nodes.slice(0,6).join('');
            grid2.innerHTML = nodes.slice(6).join('');

            // Wire de acciones
            [...grid1.querySelectorAll('.selected-item'), ...grid2.querySelectorAll('.selected-item')].forEach(card=>{
                const id = card.dataset.id; if(!id) return;
                const go = ()=> location.href = API.detailUrl(id);

                card.querySelector('img')?.addEventListener('click', go);
                card.querySelector('.product-name')?.addEventListener('click', go);
                card.querySelector('[data-action="info"]')?.addEventListener('click', ev=>{ ev.stopPropagation(); go(); });

                card.querySelector('[data-action="cart"]')?.addEventListener('click', ev=>{
                    ev.stopPropagation();
                    console.log('Añadir al carrito:', id);
                    // TODO: POST /api/carrito/items { productoId:Number(id), cantidad:1 }
                });
            });
        }

        // Helpers
        function money(n){ try{ return new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD'}).format(n); }catch{ return `$${n}`; } }
        function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

        // (Opcional) carga una categoría por defecto:
        // loadCat('cpu');

    })();
</script>


<script>
    (function(){
        const LINK_ID='themeStylesheet', STORAGE_KEY='tt-theme', BTN_ID='themeToggle';
        function setTheme(theme){
            const link=document.getElementById(LINK_ID); if(!link) return;
            const href = theme==='dark'
                ? (link.dataset.dark  || 'styleOscuroMenu.css')   // <-- aquí
                : (link.dataset.light || 'styleClaroMenu.css');
            if(link.getAttribute('href')!==href) link.setAttribute('href', href);
            localStorage.setItem(STORAGE_KEY, theme);
            const btn=document.getElementById(BTN_ID);
            if(btn){
                const dark=theme==='dark';
                btn.textContent = dark ? '☀️ Claro' : '🌙 Oscuro';
                btn.title       = dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
                btn.setAttribute('aria-pressed', String(dark));
                btn.classList.toggle('btn-warning', dark);
                btn.classList.toggle('btn-secondary', !dark);
            }
        }
        function toggleTheme(){
            const current=localStorage.getItem(STORAGE_KEY)||'light';
            setTheme(current==='light' ? 'dark' : 'light');
        }
        document.addEventListener('DOMContentLoaded',()=>{
            document.getElementById(BTN_ID)?.addEventListener('click', toggleTheme);
            setTheme(localStorage.getItem(STORAGE_KEY)||'light');
        });
    })();
</script>
</body>
</html>
