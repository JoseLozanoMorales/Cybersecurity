<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestión de productos</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <!-- React 18 + ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel para compilar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    // Iconos SVG simples (sustituyen a lucide-react)
    const Icon = ({children, size=20, className=""}) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
           stroke="currentColor" strokeWidth="2" strokeLinecap="round"
           strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Plus   = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const Edit   = (props) => <Icon {...props}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></Icon>;
    const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></Icon>;
    const Search = (props) => <Icon {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
    const X      = (props) => <Icon {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;

    function ProductManagement() {
      const [products, setProducts] = useState([
        { id: 1, nombre: 'Laptop HP Pavilion', categoria: 'Electrónicos', marca: 'HP', precio: 899.99, stock: 15, images: ['laptop1.jpg'] },
        { id: 2, nombre: 'Smartphone Samsung', categoria: 'Electrónicos', marca: 'Samsung', precio: 599.99, stock: 25, images: ['phone1.jpg'] },
        { id: 3, nombre: 'Mesa de Oficina', categoria: 'Muebles', marca: 'IKEA', precio: 299.99, stock: 8, images: ['desk1.jpg'] },
      ]);

      const [showModal, setShowModal] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [selectedProducts, setSelectedProducts] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [formData, setFormData] = useState({
        nombre: '', categoria: '', marca: '', precio: '', stock: '', enlace: '', images: [],
        consumoEnergia: '', tamano: '', socket: '', chipset: '', ramSoportada: '',
        generacion: '', velocidades: '', capacidad: '', tipo: '', tamanoGpu: '', tamanoRefrigeracion: ''
      });

      const categories = ['Fuente de poder','GPU','Motherboard','CPU','RAM','CPU COOLER','Almacenamiento','Cubierta','Periféricos'];
      const brands = ['HP','Samsung','Apple','Sony','IKEA','Nike','Adidas','Corsair','EVGA','ASUS','MSI','Intel','AMD','Kingston','Seagate'];

      const categoryFields = {
        'Fuente de poder': [{ name:'consumoEnergia', label:'Consumo de energía', type:'text' }],
        'GPU': [{ name:'consumoEnergia', label:'Consumo de energía', type:'text' },{ name:'tamano', label:'Tamaño', type:'text' }],
        'Motherboard': [{ name:'socket', label:'Socket', type:'text' },{ name:'chipset', label:'Chipset', type:'text' },{ name:'ramSoportada', label:'Ram soportada', type:'text' }],
        'CPU': [{ name:'socket', label:'Socket', type:'text' },{ name:'generacion', label:'Generación', type:'text' }],
        'RAM': [{ name:'velocidades', label:'Velocidades', type:'text' }],
        'CPU COOLER': [{ name:'tamano', label:'Tamaño', type:'text' },{ name:'socket', label:'Socket', type:'text' }],
        'Almacenamiento': [{ name:'capacidad', label:'Capacidad', type:'text' },{ name:'tipo', label:'Tipo', type:'text' }],
        'Cubierta': [{ name:'tamanoGpu', label:'Tamaño de GPU', type:'text' },{ name:'tamanoRefrigeracion', label:'Tamaño de refrigeración', type:'text' }],
        'Periféricos': [{ name:'tipo', label:'Tipo', type:'text' }],
      };

      const filteredProducts = products.filter(p =>
        p.nombre.toLowerCase().includes(searchTerm.toLowerCase()) ||
        p.categoria.toLowerCase().includes(searchTerm.toLowerCase()) ||
        p.marca.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const resetForm = () => {
        setFormData({
          nombre:'', categoria:'', marca:'', precio:'', stock:'', enlace:'', images:[],
          consumoEnergia:'', tamano:'', socket:'', chipset:'', ramSoportada:'',
          generacion:'', velocidades:'', capacidad:'', tipo:'', tamanoGpu:'', tamanoRefrigeracion:''
        });
        setEditingProduct(null);
      };

      const openModal = (product=null) => {
        if (product) {
          setFormData({
            nombre: product.nombre, categoria: product.categoria, marca: product.marca,
            precio: String(product.precio), stock: String(product.stock),
            enlace: product.enlace || '', images: product.images || []
          });
          setEditingProduct(product);
        } else {
          resetForm();
        }
        setShowModal(true);
      };

      const closeModal = () => { setShowModal(false); resetForm(); };

      const handleSubmit = () => {
        if (!formData.nombre || !formData.categoria || !formData.marca || !formData.precio || !formData.stock) {
          alert('Por favor, complete todos los campos obligatorios'); return;
        }
        const productData = { ...formData, precio: parseFloat(formData.precio), stock: parseInt(formData.stock) };
        if (editingProduct) {
          setProducts(products.map(p => p.id === editingProduct.id ? { ...editingProduct, ...productData } : p));
        } else {
          setProducts([...products, { ...productData, id: Date.now() }]);
        }
        closeModal();
      };

      const deleteSelected = () => {
        if (!selectedProducts.length) return;
        if (window.confirm(`¿Estás seguro de eliminar ${selectedProducts.length} producto(s)?`)) {
          setProducts(products.filter(p => !selectedProducts.includes(p.id)));
          setSelectedProducts([]);
        }
      };

      const handleSelectProduct = (id) => {
        setSelectedProducts(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      return (
        <div className="min-h-screen p-6">
          <div className="max-w-7xl mx-auto">
            <div className="text-center mb-8">
              <h1 className="text-3xl font-bold text-gray-800 mb-6">Gestión de productos</h1>

              <div className="flex justify-center items-center gap-4 flex-wrap">
                <button onClick={() => openModal()}
                        className="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2">
                  <Plus size={20}/> Agregar producto
                </button>

                <button onClick={deleteSelected}
                        disabled={selectedProducts.length === 0}
                        className={`px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2 ${
                          selectedProducts.length > 0 ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                        }`}>
                  <Trash2 size={20}/> Eliminar producto{selectedProducts.length > 1 ? 's' : ''}{selectedProducts.length > 0 && ` (${selectedProducts.length})`}
                </button>

                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <Search size={20} className="text-gray-400" />
                  </div>
                  <input type="text" value={searchTerm} onChange={(e)=>setSearchTerm(e.target.value)}
                         placeholder="Buscar productos..."
                         className="pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent w-64"/>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-lg shadow-lg overflow-hidden">
              <div className="overflow-x-auto max-h-96 overflow-y-auto">
                <table className="w-full">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Seleccionar</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Producto</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Categoría</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Marca</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Precio</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Stock</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                    </tr>
                  </thead>
                  <tbody className="bg-white divide-y divide-gray-200">
                    {filteredProducts.length === 0 ? (
                      <tr><td colSpan="7" className="px-6 py-8 text-center text-gray-500">
                        {searchTerm ? `No se encontraron productos que coincidan con "${searchTerm}"` : 'No hay productos disponibles'}
                      </td></tr>
                    ) : filteredProducts.map(product => (
                      <tr key={product.id} className="hover:bg-gray-50">
                        <td className="px-6 py-4">
                          <input type="checkbox"
                                 checked={selectedProducts.includes(product.id)}
                                 onChange={()=>handleSelectProduct(product.id)}
                                 className="rounded border-gray-300"/>
                        </td>
                        <td className="px-6 py-4 whitespace-nowrap">
                          <div className="text-sm font-medium text-gray-900">{product.nombre}</div>
                        </td>
                        <td className="px-6 py-4 whitespace-nowrap">
                          <span className="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">{product.categoria}</span>
                        </td>
                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{product.marca}</td>
                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${product.precio.toFixed(2)}</td>
                        <td className="px-6 py-4 whitespace-nowrap">
                          <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${
                            product.stock > 10 ? 'bg-green-100 text-green-800' :
                            product.stock > 0  ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'
                          }`}>{product.stock} unidades</span>
                        </td>
                        <td className="px-6 py-4 whitespace-nowrap text-sm font-medium">
                          <button onClick={()=>openModal(product)} className="text-indigo-600 hover:text-indigo-900 mr-3"><Edit size={16}/></button>
                          <button onClick={()=>{
                            if (window.confirm('¿Estás seguro de eliminar este producto?')) {
                              setProducts(products.filter(p => p.id !== product.id));
                            }
                          }} className="text-red-600 hover:text-red-900"><Trash2 size={16}/></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {showModal && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                <div className="bg-gray-700 rounded-lg p-6 w-full max-w-6xl text-white relative max-h-[90vh] overflow-y-auto">
                  <button onClick={closeModal} className="absolute top-4 right-4 text-white hover:text-gray-300"><X size={24}/></button>

                  <div className="flex gap-6">
                    <div className="flex-1 space-y-6">
                      <div>
                        <label className="block text-sm font-medium mb-2">Nombre <span className="text-red-400">*</span></label>
                        <input type="text" required value={formData.nombre}
                               onChange={(e)=>setFormData({...formData, nombre:e.target.value})}
                               className="w-full px-4 py-2 rounded bg-gray-600 border border-gray-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                               placeholder="Ingrese el nombre del producto"/>
                      </div>

                      <div>
                        <label className="block text-sm font-medium mb-2">Enlace</label>
                        <input type="url" value={formData.enlace}
                               onChange={(e)=>setFormData({...formData, enlace:e.target.value})}
                               className="w-full px-4 py-2 rounded bg-gray-600 border border-gray-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                               placeholder="https://ejemplo.com/producto"/>
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium mb-2">Categoría <span className="text-red-400">*</span></label>
                          <select required value={formData.categoria}
                                  onChange={(e)=>setFormData({...formData, categoria:e.target.value})}
                                  className="w-full px-4 py-2 rounded bg-gray-600 border border-gray-500 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Seleccionar categoría</option>
                            {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                          </select>
                        </div>

                        <div>
                          <label className="block text-sm font-medium mb-2">Marca <span className="text-red-400">*</span></label>
                          <select required value={formData.marca}
                                  onChange={(e)=>setFormData({...formData, marca:e.target.value})}
                                  className="w-full px-4 py-2 rounded bg-gray-600 border border-gray-500 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Seleccionar marca</option>
                            {brands.map(b => <option key={b} value={b}>{b}</option>)}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium mb-2">Precio <span className="text-red-400">*</span></label>
                          <input type="number" step="0.01" min="0" required value={formData.precio}
                                 onChange={(e)=>setFormData({...formData, precio:e.target.value})}
                                 className="w-full px-4 py-2 rounded bg-gray-600 border border-gray-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0.00"/>
                        </div>
                        <div>
                          <label className="block text-sm font-medium mb-2">Stock <span className="text-red-400">*</span></label>
                          <input type="number" min="0" required value={formData.stock}
                                 onChange={(e)=>setFormData({...formData, stock:e.target.value})}
                                 className="w-full px-4 py-2 rounded bg-gray-600 border border-gray-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="0"/>
                        </div>
                      </div>

                      <div>
                        <label className="block text-sm font-medium mb-2">Galería <span className="text-red-400">*</span></label>
                        <div className="border-2 border-dashed border-gray-500 rounded-lg p-8 text-center">
                          <div className="flex flex-col items-center">
                            <Plus size={48} className="text-gray-400 mb-4" />
                            <p className="text-gray-300 mb-2">Agregar imágenes de producto (Límite: 15)</p>
                            <input type="file" multiple accept="image/*" className="hidden" id="image-upload"
                                   onChange={(e)=>{ const files = Array.from(e.target.files); console.log('Imágenes seleccionadas:', files); }}/>
                            <label htmlFor="image-upload"
                                   className="cursor-pointer bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors">
                              Seleccionar imágenes
                            </label>
                          </div>
                        </div>
                      </div>

                      <div className="flex justify-end gap-4 pt-4">
                        <button type="button" onClick={closeModal}
                                className="px-6 py-2 border border-gray-500 text-gray-300 rounded hover:bg-gray-600 transition-colors">
                          Cancelar
                        </button>
                        <button onClick={handleSubmit}
                                className="px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded transition-colors">
                          {editingProduct ? 'Actualizar' : 'Agregar'} Producto
                        </button>
                      </div>
                    </div>

                    <div className="w-80">
                      <div className="border-2 border-dashed border-gray-500 rounded-lg p-4 h-full">
                        {formData.categoria && categoryFields[formData.categoria] ? (
                          <div className="space-y-4">
                            <h3 className="text-lg font-semibold text-center mb-4">{formData.categoria}</h3>
                            {categoryFields[formData.categoria].map((field) => (
                              <div key={field.name}>
                                <label className="block text-sm font-medium mb-2 capitalize">{field.label}</label>
                                <input type={field.type} value={formData[field.name] || ''}
                                       onChange={(e)=>setFormData({...formData, [field.name]: e.target.value})}
                                       className="w-full px-3 py-2 rounded bg-gray-600 border border-gray-500 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                       placeholder={`Ingrese ${field.label.toLowerCase()}`}/>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="flex items-center justify-center h-full text-gray-300">
                            <div className="text-center">
                              <div className="text-4xl mb-2">⚙️</div>
                              <p>Selecciona una categoría para ver campos específicos</p>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ProductManagement />);
  </script>
</body>
</html>
