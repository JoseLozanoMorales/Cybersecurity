<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Perfil - TiendaTech</title>

  <link rel="stylesheet" href="style2.css"/>
  <script src="/js/auth-menu.js?v=8" defer></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">TiendaTech</div>
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Buscar..." />
    </div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  </header>

  <!-- Overlay -->
  <div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <!-- Menú Hamburguesa -->
  <nav class="hamburger-menu" id="hamburgerMenu">
    <button class="menu-close" onclick="closeMenu()">✕</button>
    <a href="#" class="menu-item">Inicio</a>
    <a href="#" class="menu-item">Cuenta</a>
    <a href="#" class="menu-item">Carrito</a>
    <a href="#" class="menu-item">Cerrar sesión</a>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Información Personal -->
    <div class="container">
      <div class="container-header">Información Personal</div>
      <div class="container-content">
        <div class="profile-section">
          <div>
            <!-- <div class="profile-avatar">JD</div>
            <div class="avatar-label">Foto de perfil</div> -->
            <div class="avatar-wrap">
              <img id="avatar" src="/assets/avatars/defaults/user.png" alt="Foto de perfil">
              <div class="avatar-caption">Foto de perfil</div>
            </div>
          </div>
          <div class="profile-form">
            <div class="form-group">
              <label class="form-label">Nombre</label>
              <input type="text" name="nombre" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Usuario</label>
              <input type="text" name="usuario" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Número de teléfono</label>
              <input type="tel" name="telefono" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Cédula</label>
              <input type="text" name="cedula" class="form-input" readonly/>
            </div>
            <div class="form-group full-width">
              <label class="form-label">Correo</label>
              <input type="email" name="correo" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <button class="edit-btn" onclick="window.location.href='editar_usuario.html'">✏️ Editar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Direcciones -->
    <div class="container">
      <div class="container-header">Direcciones de Envío</div>
      <div class="container-content">
        <!-- Aquí se renderizan las direcciones (2 por fila) -->
        <div id="direcciones-container" class="row g-3"></div>

        <!-- Card para agregar -->
        <div class="row mt-1">
          <div class="col-12 col-md-6">
            <div class="address-card add-card" data-bs-toggle="modal" data-bs-target="#addressModal">
              <div class="add-icon">+</div>
              <div class="add-text">Agregar nueva dirección</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Métodos de Pago -->
    <div class="container">
      <div class="container-header d-flex align-items-center justify-content-between">
        <span>Métodos de Pago</span>
        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#paymentModal">
          <i class="bi bi-plus-lg me-1"></i>Agregar método
        </button>
      </div>
      <div class="container-content">
        <div id="mp-feedback" class="text-success mb-2" style="display:none;"></div>
        <div id="mp-list" class="row g-3">
          <!-- se llena por JS -->
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-nav">
      <a href="index.html" >Inicio</a>
      <a href="cuenta.html" class="active requires-auth">Cuenta</a>
      <a href="Carrito.html">Carrito</a>
    </nav>
  </footer>

  <!-- Modal: Agregar dirección -->
  <div class="modal fade" id="addressModal" tabindex="-1" aria-labelledby="addressModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addressModalLabel">
            <i class="bi bi-geo-alt me-2"></i> Agregar Dirección
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="addressForm">
            <div class="mb-3">
              <label for="addressStreet" class="form-label">
                <i class="bi bi-signpost me-1"></i> Calle y Número
              </label>
              <input type="text" class="form-control" id="addressStreet" name="calle"

            </div>

            <div class="row">

                <label for="addressProvince" class="form-label">

                </label>
                <select class="form-select" id="addressProvince" name="provincia_id" required>
                  <option value="">Seleccionar provincia</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="addressCity" class="form-label">
                  <i class="bi bi-building me-1"></i> Ciudad
                </label>
                <select class="form-select" id="addressCity" name="ciudad_id" required>

                </select>

            </div>

            <div class="mb-3">

              </label>

    <div class="modal-dialog modal-lg">

        <div class="modal-header">
          <h5 class="modal-title" id="paymentModalLabel">

  <!-- Script de sesión / logout del menú -->
  <script>
  (function () {
    const REDIRECT_TO = 'login.html';
    const menu = document.getElementById('hamburgerMenu');
    if (!menu) return;

    function hasActiveSession(){
      const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
      let ok = false;
      try { ok = !!(raw && JSON.parse(raw)); } catch { ok = !!raw; }
      return ok || !!localStorage.getItem('token') || !!localStorage.getItem('refreshToken');
    }
    function getLogoutLink(){
      return Array.from(menu.querySelectorAll('a.menu-item'))
        .find(a => (a.textContent || '').trim().toLowerCase() === 'cerrar sesión');
    }
    function updateLogoutVisibility(){
      const a = getLogoutLink();
      if (!a) return;
      if (hasActiveSession()){
        a.classList.remove('logout-disabled'); a.removeAttribute('aria-disabled'); a.tabIndex = 0;
      } else {
        a.classList.add('logout-disabled'); a.setAttribute('aria-disabled','true'); a.tabIndex = -1;
      }
    }
    menu.addEventListener('click', async function (ev) {
      const a = ev.target.closest('a.menu-item'); if (!a) return;
      const label = (a.textContent || '').trim().toLowerCase();
      if (label !== 'cerrar sesión') return;
      if (a.getAttribute('aria-disabled') === 'true' || a.classList.contains('logout-disabled')){
        ev.preventDefault(); return;
      }
      ev.preventDefault();
      try { await fetch('/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
      try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
      sessionStorage.removeItem('user'); localStorage.removeItem('user');
      localStorage.removeItem('token'); localStorage.removeItem('refreshToken');
      try { document.cookie.split(';').forEach(c=>{
        document.cookie = c.replace(/^ +/,'').replace(/=.*/,'=;expires=' + new Date(0).toUTCString() + ';path=/');
      }); } catch {}
      try { closeMenu(); } catch {}
      window.location.href = REDIRECT_TO;
    });
    document.addEventListener('DOMContentLoaded', updateLogoutVisibility);
    window.addEventListener('storage', updateLogoutVisibility);
    document.addEventListener('visibilitychange', updateLogoutVisibility);
  })();
  </script>

  <!-- DIRECCIONES + MODAL: script unificado -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // USER_ID desde sessionStorage (fallback 1)
      const USER_ID = (() => {
        try {
          const j = sessionStorage.getItem('user');
          if (!j) return 1;
          const u = JSON.parse(j);
          return u.usuarioId ?? u.id ?? u.userId ?? u.id_usuario ?? 1;
        } catch { return 1; }
      })();
      window.__USER_ID__ = USER_ID;

      // Elementos
      const listEl = document.getElementById('direcciones-container');
      const modalEl = document.getElementById('addressModal');
      const formEl  = document.getElementById('addressForm');
      const provSel = document.getElementById('addressProvince');
      const ciuSel  = document.getElementById('addressCity');

      // Helpers
      const esc = s => s ? s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) : '';
      const option = (v,t) => `<option value="${v}">${t}</option>`;
      const setLoading = (sel,msg='Cargando...') => { if (sel) sel.innerHTML = option('', msg); };

      function cardHTML(d) {
        const ciudad = d.ciudadNombre || '';
        const provincia = d.provinciaNombre || '';
        const tituloUbic = (ciudad && provincia) ? `${ciudad}, ${provincia}` : (ciudad || provincia || 'Dirección');
        return `
          <div class="col-12 col-md-6">
            <div class="address-card p-3 border rounded-3 h-100">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <strong>${esc(tituloUbic)}</strong>
                <span class="text-muted">#${d.direccionId}</span>
              </div>
              <div class="mb-1">${esc(d.calle || '')}</div>
              ${d.referencia ? `<div class="text-muted small">${esc(d.referencia)}</div>` : ''}
              <div class="mt-2 d-flex gap-2">
                <button class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${d.direccionId}">
                  <i class="bi bi-trash"></i> Eliminar
                </button>
              </div>
            </div>
          </div>`;
      }

      // Listar
      async function loadUserAddresses() {
        if (!listEl) return;
        listEl.innerHTML = `<div class="col-12 text-center py-4 text-muted">Cargando direcciones…</div>`;
        try {
          const r = await fetch(`/api/usuarios/${USER_ID}/direcciones`);
          if (!r.ok) throw new Error(await r.text());
          const data = await r.json();
          listEl.innerHTML = (!Array.isArray(data) || data.length === 0)
            ? `<div class="col-12 text-center text-muted py-4">Aún no tienes direcciones guardadas.</div>`
            : data.map(cardHTML).join('');
        } catch (e) {
          console.error(e);
          listEl.innerHTML = `<div class="col-12 text-danger text-center py-4">No se pudieron cargar las direcciones.</div>`;
        }
      }

      // Eliminar
      listEl?.addEventListener('click', async (ev) => {
        const btn = ev.target.closest('[data-action="delete"]');
        if (!btn) return;
        const id = btn.getAttribute('data-id');
        if (!id || !confirm('¿Eliminar esta dirección?')) return;
        try {
          const resp = await fetch(`/api/usuarios/${USER_ID}/direcciones/${id}`, { method: 'DELETE' });
          if (resp.status === 204) await loadUserAddresses();
          else throw new Error(`Error ${resp.status}: ${await resp.text()}`);
        } catch (err) {
          console.error(err);
          alert('No se pudo eliminar la dirección.');
        }
      });

      // Provincias / Ciudades
      async function loadProvinces() {
        setLoading(provSel);
        const r = await fetch('/api/provincias');
        if (!r.ok) throw new Error('No se pudo cargar provincias');
        const provincias = await r.json();
        provSel.innerHTML = option('', 'Seleccionar provincia') +
          provincias.map(p => option(p.provinciaId, p.nombre)).join('');
        const lr = provincias.find(p => (p.nombre || '').toLowerCase() === 'los ríos');
        if (lr) provSel.value = lr.provinciaId;
      }
      async function loadCitiesByProvince(provinciaId) {
        setLoading(ciuSel);
        const r1 = provinciaId ? await fetch(`/api/provincias/${provinciaId}/ciudades`) : null;
        if (r1 && r1.ok) {
          const ciudades = await r1.json();
          ciuSel.innerHTML = option('', 'Seleccionar ciudad') +
            ciudades.map(c => option(c.ciudadId, c.nombre)).join('');
          return;
        }
        const r2 = await fetch('/api/ciudades');
        if (!r2.ok) throw new Error('No se pudo cargar ciudades');
        const todas = await r2.json();
        ciuSel.innerHTML = option('', 'Seleccionar ciudad') +
          todas.map(c => option(c.ciudadId, c.nombre)).join('');
      }

      modalEl?.addEventListener('shown.bs.modal', async () => {
        try {
          await loadProvinces();
          await loadCitiesByProvince(provSel.value || null);
        } catch (e) {
          console.error(e);
          provSel.innerHTML = option('', 'Error cargando provincias');
          ciuSel.innerHTML  = option('', 'Error cargando ciudades');
        }
      });

      provSel?.addEventListener('change', () => loadCitiesByProvince(provSel.value || null));

      // Guardar
      formEl?.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const payload = {
          calle:       document.getElementById('addressStreet').value.trim(),
          referencia:  document.getElementById('addressReference').value.trim() || null,
          provinciaId: provSel.value ? Number(provSel.value) : null,
          ciudadId:    ciuSel.value  ? Number(ciuSel.value)  : null
        };
        try {
          const r = await fetch(`/api/usuarios/${USER_ID}/direcciones`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!r.ok) throw new Error(`Error ${r.status}: ${await r.text()}`);
          (bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl)).hide();
          formEl.reset();
          await loadUserAddresses();
        } catch (e) {
          console.error('No se pudo guardar la dirección:', e);
          alert('No se pudo guardar la dirección.');
        }
      });

      // Arrancar listado
      loadUserAddresses();
    });
  </script>
<!-- Para cuando ya tenga foto de perfil -->
  <script>
    (function () {
      const DEFAULT = '/assets/avatars/defaults/user.png';
      const img = document.getElementById('avatar');
      if (!img) return;

      // fallback si la URL falla
      img.onerror = () => { img.onerror = null; img.src = DEFAULT; };

      // leer usuario de session/local storage
      function readUser() {
        const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch { return null; }
      }
      function getId(u){
        return u?.usuarioId ?? u?.id ?? u?.userId ?? u?.id_usuario ?? u?.usuario_id ?? null;
      }
      function getAvatar(u){
        return (u?.avatar_path || u?.avatarPath || u?.avatarUrl || '').trim() || null;
      }
      async function fetchMe(){
        try {
          const r = await fetch('/api/usuarios/me');
          if (!r.ok) return null;
          return await r.json();
        } catch { return null; }
      }
      async function fetchById(id){
        if (!id) return null;
        try {
          const r = await fetch(`/api/usuarios/${id}`);
          if (!r.ok) return null;
          return await r.json();
        } catch { return null; }
      }

      (async function init(){
        // 1) desde storage
        const u = readUser();
        const id = getId(u);
        const url1 = getAvatar(u);
        if (url1) { img.src = url1 + '?t=' + Date.now(); return; }

        // 2) desde /me
        const me = await fetchMe();
        const url2 = getAvatar(me);
        if (url2) { img.src = url2 + '?t=' + Date.now(); return; }

        // 3) desde /usuarios/{id} (si tenemos id)
        if (id) {
          const byId = await fetchById(id);
          const url3 = getAvatar(byId);
          if (url3) { img.src = url3 + '?t=' + Date.now(); return; }

          // 4) último intento: convención de ruta directa (por si la BD no trae avatar_path)
          img.src = `/uploads/avatars/${id}/avatar.png?t=` + Date.now();
          return;
        }

        // 5) default
        img.src = DEFAULT;
      })();
    })();
  </script>

  <!-- === MÉTODOS DE PAGO: Lógica de UI === -->
<script>
(function(){
  // 1) USER_ID confiable
  const USER_ID = (()=>{
    if (typeof window.__USER_ID__ !== 'undefined') return window.__USER_ID__;
    try{
      const u = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || 'null');
      return u?.usuarioId ?? u?.id ?? u?.userId ?? u?.id_usuario ?? null;
    }catch{ return null; }
  })();

  const listEl   = document.getElementById('mp-list');
  const toastEl  = document.getElementById('mp-feedback');

  // Modal + form
  const modalEl   = document.getElementById('paymentModal');
  const modal     = () => (bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl));
  const form      = document.getElementById('paymentForm');
  const inputNum  = document.getElementById('cardNumber');
  const helpNum   = document.getElementById('cardHelp');
  const inputExp  = document.getElementById('expiryDate');
  const selectTip = document.getElementById('paymentTipo');
  const wrapPref  = document.getElementById('preferidoWrap');
  const chkPref   = document.getElementById('preferidoCheck');

  let editId = null;
  let API_BASE = null;   // se decide abajo

  // === Helpers de auth
  function authHeaders(extra = {}){
    const token = localStorage.getItem('token');
    const h = { 'X-User-Id': USER_ID, ...extra };   // <-- añade esto
    if (token) h['Authorization'] = `Bearer ${token}`;
    return h;
  }

  const withAuth = (opts={}) => ({
    credentials: 'include',
    ...opts,
    headers: authHeaders({ 'Content-Type':'application/json', ...(opts.headers||{}) })
  });

  // === Helpers UI
  function showToast(msg){ if (!toastEl) return; toastEl.textContent=msg; toastEl.style.display='block'; setTimeout(()=>toastEl.style.display='none', 2200); }
  function maskLast4(pan){ pan=(pan||'').toString().replace(/\s+/g,''); return pan.length>=4 ? '**** ' + pan.slice(-4) : '****'; }
  function toMMYYYY(s){
    if(!s) return null;
    // acepta 'YYYY-MM[-DD]' o 'MM/YYYY'
    if (/^\d{4}-\d{2}(-\d{2})?$/.test(s)) { const [y,m] = s.split('-'); return `${m}/${y}`; }
    return s;
  }
  function monthToDateStr(yyyyMm){ if(!yyyyMm) return null; const [y,m]=yyyyMm.split('-'); return `${y}-${m}-01`; }
  function luhnOk(num){
    num=(num||'').replace(/\s+/g,''); if (!/^\d{12,19}$/.test(num)) return false;
    let sum=0,d=false; for(let i=num.length-1;i>=0;i--){ let k=+num[i]; if(d){ k*=2; if(k>9)k-=9; } sum+=k; d=!d; }
    return sum%10===0;
  }
  function expFuture(yyyyMm){
    if (!yyyyMm) return false;
    const [y,m]=yyyyMm.split('-').map(Number); const now=new Date();
    const ymSel=y*100+m, ymNow=now.getFullYear()*100+(now.getMonth()+1);
    return ymSel>=ymNow;
  }

  // === Normalizador de campos del backend
  function normalizeItem(x){
    const id   = x.id ?? x.metodoPagoId ?? x.metodopago_id ?? x.metodopagoId ?? x.metodo_pago_id;
    const num  = x.numero ?? x.numero_tarjeta ?? x.numeroTarjeta;
    const ven  = toMMYYYY(x.vence ?? x.fecha_expiracion ?? x.fechaExpiracion);
    const tId  = x.tipoId ?? x.tipo_id ?? x.tipometodo_id ?? x.tipometodoId;
    const tNom = x.tipoNombre ?? x.tipo ?? x.nombre_tipo ?? x.nombreTipo;
    const hab  = ('habilitado' in x) ? !!x.habilitado : true;
    const pref = x.esPreferido ?? x.preferido ?? x.es_preferido ?? false;
    return {
      id, numero: num, vence: ven, tipoId: tId, tipoNombre: tNom,
      habilitado: hab, esPreferido: pref, mascara: maskLast4(num)
    };
  }

  // === Selección de endpoint (probando varias rutas comunes)
  // Siempre usa el endpoint por sesión/servidor
  async function pickApiBase(){
    return '/api/mis-metodos-pago';
  }


  // === API CRUD
  async function apiList(){
    if (!API_BASE) API_BASE = await pickApiBase();
    const r = await fetch(API_BASE, withAuth());
    const j = await r.json();
    const arr = Array.isArray(j?.data) ? j.data : (Array.isArray(j) ? j : []);
    return arr.map(normalizeItem);
  }
  async function apiAdd(payload){
    const r = await fetch(API_BASE, withAuth({ method:'POST', body:JSON.stringify(payload) }));
    const j = await r.json(); if(!r.ok || j.success===false) throw new Error(j.error || 'Error al crear');
    const arr = Array.isArray(j?.data) ? j.data : (Array.isArray(j) ? j : []);
    return arr.map(normalizeItem);
  }
  async function apiPatch(id,payload){
    const r = await fetch(`${API_BASE}/${id}`, withAuth({ method:'PATCH', body:JSON.stringify(payload) }));
    const j = await r.json(); if(!r.ok || j.success===false) throw new Error(j.error || 'Error al actualizar');
    const arr = Array.isArray(j?.data) ? j.data : (Array.isArray(j) ? j : []);
    return arr.map(normalizeItem);
  }
  async function apiPrefer(id){
    const r = await fetch(`${API_BASE}/${id}/preferido`, withAuth({ method:'PUT' }));
    const j = await r.json(); if(!r.ok || j.success===false) throw new Error(j.error || 'No se pudo marcar preferido');
    const arr = Array.isArray(j?.data) ? j.data : (Array.isArray(j) ? j : []);
    return arr.map(normalizeItem);
  }

  // === Render
  function card(it){
    return `
    <div class="col-12 col-md-6 col-lg-4">
      <div class="p-3 border rounded-3 h-100">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div class="fw-semibold">${it.mascara} ${it.esPreferido ? '<span class="badge bg-primary">Preferido</span>' : ''}</div>
            <div class="text-muted small">Vence: ${it.vence || '—'} · Tipo: ${it.tipoNombre || it.tipoId || '—'}</div>
            <div class="text-muted small">Estado: ${it.habilitado ? 'Habilitado' : 'Deshabilitado'}</div>
          </div>
          <div class="btn-group">
            <button class="btn btn-sm btn-outline-secondary" data-act="prefer" data-id="${it.id}" title="Marcar como preferido"><i class="bi bi-star"></i></button>
            <button class="btn btn-sm btn-outline-primary" data-act="edit" data-id="${it.id}" title="Editar"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm ${it.habilitado?'btn-outline-danger':'btn-outline-success'}" data-act="toggle" data-id="${it.id}" title="${it.habilitado?'Deshabilitar':'Habilitar'}">
              <i class="bi ${it.habilitado?'bi-x-circle':'bi-check-circle'}"></i>
            </button>
          </div>
        </div>
      </div>
    </div>`;
  }
  function render(list){
    if (!list || list.length===0){
      listEl.innerHTML = `<div class="col-12 text-center text-muted py-4">Aún no tienes métodos de pago.</div>`;
      return;
    }
    listEl.innerHTML = list.map(card).join('');
  }

  // === Modal y eventos
  inputNum?.addEventListener('input', function(){
    let value = this.value.replace(/\s/g,'').replace(/[^0-9]/g,'');
    let formatted = value.match(/.{1,4}/g)?.join(' ') || value;
    if (formatted.length <= 19) this.value = formatted;
  });

  modalEl.addEventListener('hidden.bs.modal', () => { form.reset(); editId=null; helpNum.textContent='No se almacenan espacios. Validación Luhn.'; helpNum.classList.remove('text-danger'); });
  modalEl.addEventListener('show.bs.modal', ()=>{ wrapPref.style.display = (editId==null)?'block':'none'; chkPref.checked=false; });

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const rawNum = inputNum.value.trim().replace(/\s+/g,'');
    const month  = inputExp.value;
    const tipoId = parseInt(selectTip.value,10)||null;

    if (!luhnOk(rawNum)){ helpNum.textContent='Número inválido (Luhn).'; helpNum.classList.add('text-danger'); return; }
    if (!expFuture(month)){ alert('La fecha de expiración debe ser actual o futura.'); return; }

    try{
      if (editId==null){
        const payload = { numeroTarjeta: rawNum, fechaExpiracion: monthToDateStr(month), tipoId, preferido: chkPref.checked===true };
        const data = await apiAdd(payload);
        render(data); showToast('Método agregado.');
      } else {
        const payload = { numeroTarjeta: rawNum, fechaExpiracion: monthToDateStr(month), tipoId };
        const data = await apiPatch(editId, payload);
        render(data); showToast('Método actualizado.');
      }
      modal().hide(); form.reset(); editId=null;
    }catch(err){ alert(err.message || 'Error'); }
  });

  listEl.addEventListener('click', async (ev)=>{
    const btn = ev.target.closest('button[data-act]'); if(!btn) return;
    const id = +btn.dataset.id; const act = btn.dataset.act;
    try{
      if (act==='prefer'){
        const data = await apiPrefer(id); render(data); showToast('Preferido actualizado.');
      } else if (act==='toggle'){
        const isDisable = btn.title.includes('Deshabilitar');
        const payload = { habilitado: !isDisable ? true : false };
        const data = await apiPatch(id, payload);
        render(data); showToast(isDisable ? 'Método deshabilitado.' : 'Método habilitado.');
      } else if (act==='edit'){
        const list = await apiList();
        const it = list.find(x=>x.id===id); if(!it){ alert('No se encontró el método.'); return; }
        editId = id;
        inputNum.value = '';
        inputExp.value = (it.vence && /^\d{2}\/\d{4}$/.test(it.vence)) ? (it.vence.slice(3,7) + '-' + it.vence.slice(0,2)) : '';
        selectTip.value = it.tipoId ?? '';
        modal().show();
      }
    }catch(err){ alert(err.message || 'Error'); }
  });

  (async function init(){
    try {
      if (!USER_ID){ console.warn('USER_ID no resuelto. Intentando endpoint por sesión.'); }
      const data = await apiList();
      render(data);
    } catch(e){
      console.error('No se pudieron cargar los métodos de pago', e);
      listEl.innerHTML = `<div class="col-12 text-danger text-center py-4">No se pudieron cargar los métodos de pago.</div>`;
    }
  })();
})();
</script>

</body>
</html>
