<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compras - TiendaTech</title>

    <link rel="stylesheet" href="/css/pages/carrito-inline-1.css">
    <link rel="stylesheet" href="css/style2.css">
    <script src="/js/auth-menu.js?v=4" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">

    <link id="themeStylesheet" rel="stylesheet"
          href="css/styleClaroMenu.css" data-light="css/styleClaroMenu.css"
          data-dark="css/styleOscuroMenu.css" />

  <link rel="stylesheet" href="/css/csp-static.css">
  <link rel="stylesheet" href="/css/csp-runtime.css">
  <script src="/js/csp-style-runtime.js"></script>
</head>
<body>
<div class="page-container">
    <!-- Header -->
    <header class="header">
        <div class="logo">TiendaTech</div>
        <div class="search-container d-none d-md-block">
            <input type="text" class="search-bar" placeholder="Buscar...">
        </div>
        <button class="menu-toggle" data-csp-handler-click="csp-carrito-1">☰</button>
        <!-- Modo oscuro -->
        <button id="themeToggle" class="theme-toggle"
                type="button" aria-pressed="false">
            <span class="ico">🌙</span><span class="txt">Oscuro</span>
        </button>
    </header>

    <!-- Overlay -->
    <div class="overlay" id="overlay" data-csp-handler-click="csp-carrito-2"></div>

    <!-- Menú Hamburguesa -->
    <nav class="hamburger-menu" id="hamburgerMenu">
        <button class="menu-close" data-csp-handler-click="csp-carrito-3">✕</button>
        <a href="#" class="menu-item">Inicio</a>
        <a href="#" class="menu-item">Cuenta</a>
        <a href="#" class="menu-item">Carrito</a>
        <a href="#" class="menu-item" >Cerrar sesión</a>
    </nav>

    <!-- Main Container -->
    <main class = "content-wrap">
        <div class="container mt-4">
            <div class="row">
                <!-- Cart Items -->
                <div class="col-12 col-lg-7">
                    <div id="cart-items"></div>

                    <!-- Empty Cart Message -->
                    <div id="empty-cart" class="empty-cart csp-s-65d1f1c3d796">
                        <i class="bi bi-cart-x"></i>
                        <h4>Tu carrito está vacío</h4>
                        <p>¡Explora nuestros productos y encuentra algo que te guste!</p>
                    </div>
                </div>

                <!-- Cart Summary -->
                <div class="col-12 col-lg-5">
                    <div class="cart-summary">
                        <h5 class="mb-4">Resumen del pedido</h5>

                        <div class="summary-row">
                            <span>Subtotal (4 productos):</span>
                            <span id="subtotal">$1,249.97</span>
                        </div>

                        <!--                <div class="summary-row">-->
                        <!--                    <span>Envío:</span>-->
                        <!--                    <span id="shipping">$15.00</span>-->
                        <!--                </div>-->

                        <div class="summary-row">
                            <span>Impuestos:</span>
                            <span id="taxes">$126.50</span>
                        </div>

                        <div class="summary-row">
                            <span>Total:</span>
                            <span id="total">$1,391.47</span>
                        </div>

                        <button class="checkout-btn" data-csp-handler-click="csp-carrito-4">
                            <i class="bi bi-credit-card me-2"></i>
                            Proceder al pago
                        </button>

                        <div class="csp-s-d13405ae7c85">
                            <button class="continue-shopping-btn" data-csp-handler-click="csp-carrito-5">
                                <i class="bi bi-arrow-left me-2"></i>
                                Continuar comprando
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <footer class="footer">
        <nav class="footer-nav">
            <a href="index.html" >Inicio</a>
            <a href="cuenta.html" >Cuenta</a>
            <a href="Carrito.html" class="active"> Carrito</a>
        </nav>
    </footer>
</div>


<script src="/js/pages/carrito-inline-1.js"></script>

<script src="/js/pages/carrito-inline-2.js"></script>
<script src="/js/pages/carrito-inline-3.js"></script>

<script src="/js/pages/carrito-inline-4.js"></script>

<script src="/js/pages/carrito-inline-5.js"></script>

<script src="/js/pages/carrito-inline-6.js"></script>

<script src="/js/pages/carrito-events.js"></script>
</body>
</html>
