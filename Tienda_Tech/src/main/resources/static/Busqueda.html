<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados de búsqueda - TiendaTech</title>
  <!-- <link rel="stylesheet" href="style2.css"> -->
  <script src="/js/auth-menu.js?v=4" defer></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/pages/busqueda-inline-1.css">

  <link id="themeStylesheet" rel="stylesheet"
        href="css/styleClaroMenu.css" data-light="css/styleClaroMenu.css"
        data-dark="css/styleOscuroMenu.css" />

  <link rel="stylesheet" href="/css/csp-static.css">
  <link rel="stylesheet" href="/css/csp-runtime.css">
  <script src="/js/csp-style-runtime.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">TiendaTech</div>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-bar" placeholder="Buscar...">
    </div>
    <button class="menu-toggle" data-csp-handler-click="csp-busqueda-1">☰</button>
    <!-- Modo oscuro -->
    <button id="themeToggle" class="theme-toggle"
            type="button" aria-pressed="false">
      <span class="ico">🌙</span><span class="txt">Oscuro</span>
    </button>
  </header>

  <!-- Overlay -->
  <div class="overlay" id="overlay" data-csp-handler-click="csp-busqueda-2"></div>

  <!-- Menú Hamburguesa -->
  <nav class="hamburger-menu" id="hamburgerMenu">
    <button class="menu-close" data-csp-handler-click="csp-busqueda-3">✕</button>
    <a href="index.html" class="menu-item">Inicio</a>
    <a href="cuenta.html" class="menu-item">Cuenta</a>
    <a href="Carrito.html" class="menu-item">Carrito</a>
    <a href="#" class="menu-item">Cerrar sesión</a>
  </nav>

  <!-- Results -->
  <div class="results-container">
    <div class="results-title" id="resultsTitle">Resultados de la búsqueda</div>
    <div id="resultsContainer"></div>
    <div class="no-results d-none" id="noResults"><p>No se encontraron productos.</p></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-nav">
      <a href="index.html">Inicio</a>
      <a href="cuenta.html">Cuenta</a>
      <a href="Carrito.html">Carrito</a>
    </nav>
  </footer>

  <!-- Snack -->
  <div id="snack">Producto añadido al carrito</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

  <script src="/js/pages/busqueda-inline-1.js"></script>

  <script src="/js/pages/busqueda-inline-2.js"></script>

  <script src="/js/pages/busqueda-inline-3.js"></script>



  <script src="/js/pages/busqueda-inline-4.js"></script>
<script src="/js/pages/busqueda-events.js"></script>
</body>
</html>
