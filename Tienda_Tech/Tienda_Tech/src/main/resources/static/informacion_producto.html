<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Información del producto - TiendaTech</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style2.css">
  <script src="/js/auth-menu.js?v=4" defer></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">TiendaTech</div>
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Buscar...">
    </div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  </header>

  <nav class="hamburger-menu" id="hamburgerMenu">
    <button class="menu-close" onclick="closeMenu()">✕</button>
    <a href="index.html" class="menu-item">Inicio</a>
    <a href="cuenta.html" class="menu-item">Cuenta</a>
    <a href="Carrito.html" class="menu-item">Carrito</a>
    <a href="#" class="menu-item">Cerrar sesión</a>
  </nav>

  <!-- Main Container -->
  <div class="container mt-4">
    <!-- Product Information Section -->
    <div class="mb-4">
      <div class="row g-3">
        <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-start">
          <div class="product-image" onclick="uploadImage()">
            <div>Imagen del producto</div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="product-info">
            <div class="product-info-item">Nombre del producto</div>
            <div class="product-info-item">Precio</div>
            <div class="product-info-item">Marca</div>
            <div class="product-info-item" onclick="showCharacteristics()">Características</div>

            <!-- === NUEVO: cantidad + botón Agregar al carrito === -->
            <div class="d-flex align-items-center gap-2 mt-3">
              <input id="qtyInput" type="number" min="1" value="1" class="form-control" style="max-width: 110px;">
              <button id="btnAddCart" class="btn btn-primary">
                <i class="bi bi-cart-plus me-1"></i> Agregar al carrito
              </button>
            </div>
            <small id="addCartMsg" class="text-success d-none mt-2">Añadido al carrito.</small>
            <small id="addCartErr" class="text-danger d-none mt-2">No se pudo agregar. Inténtalo nuevamente.</small>
            <!-- === FIN NUEVO === -->
          </div>
        </div>
      </div>
    </div>

    <!-- Reviews Section -->
    <div class="mb-5">
      <div class="review-box">
        <div class="review-title">Reseñas</div>
        <div class="review-grid">
          <div class="review-item review-add-btn" onclick="addReview()">
            <div class="text-center">
              <div style="font-size: 24px; margin-bottom: 5px;">+</div>
              Agregar reseña
            </div>
          </div>
          <div class="review-item"></div>
          <div class="review-item"></div>
          <div class="review-item"></div>
          <div class="review-item"></div>
          <div class="review-item"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-nav">
      <a href="index.html" class="active">Inicio</a>
      <a href="cuenta.html">Cuenta</a>
      <a href="Carrito.html">Carrito</a>
    </nav>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

  <script>
    (function () {
      const REDIRECT_TO = 'login.html';

      const menu = document.getElementById('hamburgerMenu');
      if (!menu) return;

      function hasActiveSession(){
        const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
        let ok = false;
        try { ok = !!(raw && JSON.parse(raw)); } catch { ok = !!raw; }
        return ok || !!localStorage.getItem('token') || !!localStorage.getItem('refreshToken');
      }

      function getLogoutLink(){
        return Array.from(menu.querySelectorAll('a.menu-item'))
          .find(a => (a.textContent || '').trim().toLowerCase() === 'cerrar sesión');
      }

      function updateLogoutVisibility(){
        const a = getLogoutLink();
        if (!a) return;
        if (hasActiveSession()){
          a.classList.remove('logout-disabled');
          a.removeAttribute('aria-disabled');
          a.tabIndex = 0;
        } else {
          a.classList.add('logout-disabled');
          a.setAttribute('aria-disabled','true');
          a.tabIndex = -1;
        }
      }

      menu.addEventListener('click', async function (ev) {
        const a = ev.target.closest('a.menu-item');
        if (!a) return;

        const label = (a.textContent || '').trim().toLowerCase();
        if (label !== 'cerrar sesión') return;

        if (a.getAttribute('aria-disabled') === 'true' || a.classList.contains('logout-disabled')){
          ev.preventDefault();
          return;
        }

        ev.preventDefault();

        try { await fetch('/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
        try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}

        sessionStorage.removeItem('user');
        localStorage.removeItem('user');
        localStorage.removeItem('token');
        localStorage.removeItem('refreshToken');

        try {
          document.cookie.split(';').forEach(c=>{
            document.cookie = c.replace(/^ +/,'')
              .replace(/=.*/,'=;expires=' + new Date(0).toUTCString() + ';path=/');
          });
        } catch {}

        try { closeMenu(); } catch {}
        window.location.href = REDIRECT_TO;
      });

      document.addEventListener('DOMContentLoaded', updateLogoutVisibility);
      window.addEventListener('storage', updateLogoutVisibility);
      document.addEventListener('visibilitychange', updateLogoutVisibility);
    })();
  </script>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('hamburgerMenu');
      const overlay = document.getElementById('overlay');
      menu.classList.toggle('active');
      if (overlay) overlay.classList.toggle('active');
    }

    function closeMenu() {
      const menu = document.getElementById('hamburgerMenu');
      const overlay = document.getElementById('overlay');
      menu.classList.remove('active');
      if (overlay) overlay.classList.remove('active');
    }

    function uploadImage() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = function(event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
            const productImage = document.querySelector('.product-image');
            productImage.style.backgroundImage = `url(${e.target.result})`;
            productImage.style.backgroundSize = 'cover';
            productImage.style.backgroundPosition = 'center';
            productImage.innerHTML = '<div style="background: rgba(0,0,0,0.5); padding: 5px; border-radius: 4px; color: white; font-size: 10px;">Cambiar imagen</div>';
          };
          reader.readAsDataURL(file);
        }
      };
      input.click();
    }

    function showCharacteristics() {
      alert('Mostrar características del producto');
    }

    function addReview() {
      alert('Agregar nueva reseña');
    }
  </script>

  <script>
    // === Carga del producto + Agregar al carrito ===
    (function(){
      const params = new URLSearchParams(location.search);
      const id = params.get('id');

      const imgBox   = document.querySelector('.product-image');
      const infoBox  = document.querySelector('.product-info');

      const btnAdd   = document.getElementById('btnAddCart');
      const qtyInput = document.getElementById('qtyInput');
      const okMsg    = document.getElementById('addCartMsg');
      const errMsg   = document.getElementById('addCartErr');

      function money(n){
        const x = Number(n);
        return isFinite(x) ? `$${x.toFixed(2)}` : '$0.00';
      }

      function hasActiveSessionCart(){
        const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
        let ok = false;
        try { ok = !!(raw && JSON.parse(raw)); } catch { ok = !!raw; }
        return ok || !!localStorage.getItem('token') || !!localStorage.getItem('refreshToken');
      }

      async function tryPost(url, body){
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body)
        });
      }

      async function addToCart(){
        if(!id){ alert('Falta parámetro id'); return; }
        const cantidad = Math.max(1, parseInt(qtyInput.value || '1', 10));
        btnAdd.disabled = true;
        okMsg.classList.add('d-none');
        errMsg.classList.add('d-none');

<!--        try {-->
<!--          if (hasActiveSessionCart()){-->
<!--            // 1) Intento endpoint REST típico-->
<!--            let res = await tryPost('/api/carrito/items', { productoId: Number(id), cantidad });-->
<!--            // 2) Fallback a otro nombre común-->
<!--            if(!res.ok){-->
<!--              res = await tryPost('/api/carrito/agregar', { productoId: Number(id), cantidad });-->
<!--            }-->
<!--            if(!res.ok) throw new Error('backend_error');-->
<!--          } else {-->
<!--            // Carrito en localStorage para invitados-->
<!--            const key = 'cart';-->
<!--            const cart = JSON.parse(localStorage.getItem(key) || '[]');-->
<!--            const found = cart.find(x => String(x.productoId) === String(id));-->
<!--            if (found) found.cantidad += cantidad;-->
<!--            else cart.push({ productoId: Number(id), cantidad });-->
<!--            localStorage.setItem(key, JSON.stringify(cart));-->
<!--          }-->

        try {
        if (hasActiveSessionCart()){
          // Un único POST al endpoint real del backend
          const res = await tryPost('/api/carrito/items', { productoId: Number(id), cantidad });
          if (!res.ok) throw new Error('backend_error');
        } else {
          // Carrito en localStorage para invitados
          const key = 'cart';
          const cart = JSON.parse(localStorage.getItem(key) || '[]');
          const found = cart.find(x => String(x.productoId) === String(id));
          if (found) found.cantidad += cantidad;
          else cart.push({ productoId: Number(id), cantidad });
          localStorage.setItem(key, JSON.stringify(cart));
        }


          okMsg.classList.remove('d-none');
          setTimeout(()=> okMsg.classList.add('d-none'), 2500);
        } catch (e){
          console.error(e);
          errMsg.classList.remove('d-none');
          setTimeout(()=> errMsg.classList.add('d-none'), 3000);
        } finally {
          btnAdd.disabled = false;
        }
      }

      async function load(){
        if(!id){ alert('Falta parámetro id'); return; }
        try{
          const res = await fetch(`/api/productos/${encodeURIComponent(id)}`, { credentials:'include' });
          if(!res.ok){ throw new Error('No se pudo cargar el producto'); }
          const p = await res.json();

          const url = p.imagenId ? `/api/galeria/${p.imagenId}/img` : '/img/placeholder.png';
          imgBox.style.backgroundImage    = `url("${url}")`;
          imgBox.style.backgroundSize     = 'cover';
          imgBox.style.backgroundPosition = 'center';
          imgBox.innerHTML = '';

          const items = infoBox.querySelectorAll('.product-info-item');
          if(items[0]) items[0].textContent = p.nombre || '';
          if(items[1]) items[1].textContent = money(p.precio);
          if(items[2]) items[2].textContent = p.marca  || '';

          if (Array.isArray(p.galeria) && p.galeria.length > 0){
            const thumbs = document.createElement('div');
            thumbs.className = 'd-flex gap-2 mt-3 flex-wrap';
            p.galeria.forEach(g => {
              const a = document.createElement('a');
              a.href  = 'javascript:void(0)';
              a.onclick = () => {
                imgBox.style.backgroundImage = `url("/api/galeria/${g.id}/img")`;
              };
              const im = document.createElement('img');
              im.src = `/api/galeria/${g.id}/img`;
              im.alt = 'miniatura';
              im.style.width = '60px';
              im.style.height = '60px';
              im.style.objectFit = 'cover';
              im.style.borderRadius = '6px';
              a.appendChild(im);
              thumbs.appendChild(a);
            });
            infoBox.appendChild(thumbs);
          }
        }catch(err){
          console.error(err);
          alert('No se pudo cargar la información del producto');
        }
      }

      if (btnAdd) btnAdd.addEventListener('click', addToCart);
      document.addEventListener('DOMContentLoaded', load);
    })();
  </script>
</body>
</html>
