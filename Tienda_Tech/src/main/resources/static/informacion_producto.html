<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información del producto - TiendaTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style2.css">
    <script src="/js/auth-menu.js?v=4" defer></script>
  <link rel="stylesheet" href="/css/csp-static.css">
  <link rel="stylesheet" href="/css/csp-runtime.css">
  <script src="/js/csp-style-runtime.js"></script>
</head>
<body>
<!-- Header -->
<div class="page-container">
    <header class="header">
        <div class="logo">TiendaTech</div>
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Buscar...">
        </div>
        <button class="menu-toggle" data-csp-handler-click="csp-informacion_producto-1">☰</button>
    </header>

    <nav class="hamburger-menu" id="hamburgerMenu">
        <button class="menu-close" data-csp-handler-click="csp-informacion_producto-2">✕</button>
        <a href="index.html" class="menu-item">Inicio</a>
        <a href="cuenta.html" class="menu-item">Cuenta</a>
        <a href="Carrito.html" class="menu-item">Carrito</a>
        <a href="#" class="menu-item">Cerrar sesión</a>
    </nav>

    <!-- Main Container -->
    <main class="content-wrap">
        <div class="container mt-4">
            <!-- Product Information Section -->
            <div class="mb-4">
                <div class="row g-3">
                    <div class="col-12 col-md-6 d-flex justify-content-center justify-content-md-start">
                        <!-- CONTENEDOR DE MEDIA -->
                        <div class="media-stack media--below">  <!-- cambia a media--left si quieres estilo Amazon -->
                            <div class="tt-gallery">
                                <button class="nav prev" type="button" aria-label="Anterior">❮</button>
                                <img id="mainImg" alt="Imagen del producto">
                                <button class="nav next" type="button" aria-label="Siguiente">❯</button>
                            </div>

                            <div id="thumbs" class="tt-thumbs"></div>
                        </div>

                    </div>

                    <div class="col-12 col-md-6">
                        <div class="product-info">
                            <div class="product-info-item">Nombre del producto</div>
                            <div class="product-info-item">Precio</div>
                            <div class="product-info-item">Marca</div>
                            <a id="specLink" class="product-info-item">Características</a>

                            <!-- === NUEVO: cantidad + botón Agregar al carrito === -->
                            <div class="d-flex align-items-center gap-2 mt-3">
                                <input id="qtyInput" type="number" min="1" value="1" class="form-control csp-s-a7a12dd37898">
                                <button id="btnAddCart" class="btn btn-primary">
                                    <i class="bi bi-cart-plus me-1"></i> Agregar al carrito
                                </button>
                            </div>
                            <small id="addCartMsg" class="text-success d-none mt-2">Añadido al carrito.</small>
                            <small id="addCartErr" class="text-danger d-none mt-2">No se pudo agregar. Inténtalo nuevamente.</small>
                            <!-- === FIN NUEVO === -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Reviews Section -->
            <div class="mb-5">
                <!-- <div class="review-box">
                  <div class="review-title">Reseñas</div>
                  <div class="review-grid">
                    <div class="review-item review-add-btn" data-csp-handler-click="csp-informacion_producto-3">
                      <div class="text-center">
                        <div class="csp-s-760690da641f">+</div>
                        Agregar reseña
                      </div>
                    </div>
                    <div class="review-item"></div>
                    <div class="review-item"></div>
                    <div class="review-item"></div>
                    <div class="review-item"></div>
                    <div class="review-item"></div>
                  </div>
                </div> -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <nav class="footer-nav">
            <a href="index.html" class="active">Inicio</a>
            <a href="cuenta.html">Cuenta</a>
            <a href="Carrito.html">Carrito</a>
        </nav>
    </footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

<script src="/js/pages/informacion_producto-inline-1.js"></script>

<script src="/js/pages/informacion_producto-inline-2.js"></script>


<script src="/js/pages/informacion_producto-inline-3.js"></script>
<script src="/js/pages/informacion_producto-events.js"></script>
</body>
</html>
