<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Perfil - TiendaTech</title>

  <!-- <link rel="stylesheet" href="style2.css"/> -->
  <script src="/js/auth-menu.js?v=8" defer></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link id="themeStylesheet" rel="stylesheet"
  href="css/styleClaroMenu.css" data-light="css/styleClaroMenu.css"
  data-dark="css/styleOscuroMenu.css" />
  <link rel="stylesheet" href="/css/csp-static.css">
  <link rel="stylesheet" href="/css/csp-runtime.css">
  <script src="/js/csp-style-runtime.js"></script>
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">TiendaTech</div>
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Buscar..." />
    </div>
    <button class="menu-toggle" data-csp-handler-click="csp-cuenta-1">☰</button>
    <!-- Modo oscuro -->
    <button id="themeToggle" class="theme-toggle"
            type="button" aria-pressed="false">
      <span class="ico">🌙</span><span class="txt">Oscuro</span>
    </button>
  </header>

  <!-- Overlay -->
  <div class="overlay" id="overlay" data-csp-handler-click="csp-cuenta-2"></div>

  <!-- Menú Hamburguesa -->
  <nav class="hamburger-menu" id="hamburgerMenu">
    <button class="menu-close" data-csp-handler-click="csp-cuenta-3">✕</button>
    <a href="index.html" class="menu-item">Inicio</a>
    <a href="cuenta.html" class="menu-item requires-auth">Cuenta</a>
    <a href="Carrito.html" class="menu-item requires-auth">Carrito</a>
    <a href="#" class="menu-item">Cerrar sesión</a>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Información Personal -->
    <div class="container">
      <div class="container-header">Información Personal</div>
      <div class="container-content">
        <div class="profile-section">
          <div>
            <!-- <div class="profile-avatar">JD</div>
            <div class="avatar-label">Foto de perfil</div> -->
            <div class="avatar-wrap">
              <img id="avatar" src="/assets/avatars/defaults/user.png" alt="Foto de perfil">
              <div class="avatar-caption">Foto de perfil</div>
            </div>
          </div>
          <div class="profile-form">
            <div class="form-group">
              <label class="form-label">Nombre</label>
              <input type="text" name="nombre" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Usuario</label>
              <input type="text" name="usuario" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Número de teléfono</label>
              <input type="tel" name="telefono" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Cédula</label>
              <input type="text" name="cedula" class="form-input" readonly/>
            </div>
            <div class="form-group full-width">
              <label class="form-label">Correo</label>
              <input type="email" name="correo" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <button class="edit-btn" data-csp-handler-click="csp-cuenta-4">✏️ Editar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Direcciones -->
    <div class="container">
      <div class="container-header">Direcciones de Envío</div>
      <div class="container-content">
        <!-- Aquí se renderizan las direcciones (2 por fila) -->
        <div id="direcciones-container" class="row g-3"></div>

        <!-- Card para agregar -->
        <div class="row mt-1">
          <div class="col-12 col-md-6">
            <div class="address-card add-card" data-bs-toggle="modal" data-bs-target="#addressModal">
              <div class="add-icon">+</div>
              <div class="add-text">Agregar nueva dirección</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Métodos de Pago -->
    <div class="container">
      <div class="container-header d-flex align-items-center justify-content-between">
        <span>Métodos de Pago</span>
        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#paymentModal">
          <i class="bi bi-plus-lg me-1"></i>Agregar método
        </button>
      </div>
      <div class="container-content">
        <div id="mp-feedback" class="text-success mb-2 csp-s-6aa34d7432e7"></div>
        <div id="mp-list" class="row g-3">
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-nav">
      <a href="index.html" >Inicio</a>
      <a href="cuenta.html" class="active requires-auth">Cuenta</a>
      <a href="Carrito.html">Carrito</a>
    </nav>
  </footer>

  <!-- Modal: Agregar dirección -->
  <div class="modal fade" id="addressModal" tabindex="-1" aria-labelledby="addressModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addressModalLabel">
            <i class="bi bi-geo-alt me-2"></i> Agregar Dirección
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="addressForm">
            <div class="mb-3">
              <label for="addressStreet" class="form-label">
                <i class="bi bi-signpost me-1"></i> Calle y Número
              </label>
              <input type="text" class="form-control" id="addressStreet" name="calle"
                     placeholder="Ej: Av. Principal 123, Casa azul" required/>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="addressProvince" class="form-label">
                  <i class="bi bi-map me-1"></i> Provincia
                </label>
                <select class="form-select" id="addressProvince" name="provincia_id" required>
                  <option value="">Seleccionar provincia</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="addressCity" class="form-label">
                  <i class="bi bi-building me-1"></i> Ciudad
                </label>
                <select class="form-select" id="addressCity" name="ciudad_id" required>
                  <option value="">Seleccionar ciudad</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="addressReference" class="form-label">
                <i class="bi bi-info-circle me-1"></i> Referencia (Opcional)
              </label>
              <textarea class="form-control" id="addressReference" name="referencia" rows="2"
                        placeholder="Ej: Cerca del centro comercial, edificio azul, segunda planta"></textarea>
            </div>

            <button type="submit" class="save-btn">
              <i class="bi bi-save me-2"></i> Guardar Dirección
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Métodos de pago (agregar/editar) -->
  <div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="paymentModalLabel">
            <i class="bi bi-credit-card me-2"></i> Método de Pago
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="paymentForm">
            <div class="row">
              <div class="col-md-8 mb-3">
                <label for="cardNumber" class="form-label">
                  <i class="bi bi-credit-card-2-front me-1"></i> Número de Tarjeta
                </label>
                <input type="text" class="form-control" id="cardNumber" name="numero_tarjeta"
                       placeholder="1234 5678 9012 3456" maxlength="19" required/>
                <small id="cardHelp" class="text-muted">No se almacenan espacios</small>
              </div>
              <div class="col-md-4 mb-3">
                <label for="expiryDate" class="form-label">
                  <i class="bi bi-calendar-event me-1"></i> Fecha de Expiración
                </label>
                <input type="month" class="form-control" id="expiryDate" name="fecha_expiracion" required/>
              </div>
            </div>

            <div class="mb-3">
              <label for="paymentTipo" class="form-label">
                <i class="bi bi-ui-checks me-1"></i> Tipo de Tarjeta
              </label>
              <select class="form-select" id="paymentTipo" name="tipo_id" required>
                <!-- se llena por JS -->
              </select>
            </div>

            <div class="form-check mb-3" id="preferidoWrap">
              <input id="preferidoCheck" type="checkbox" class="form-check-input">
              <label class="form-check-label" for="preferidoCheck">Marcar como preferido</label>
            </div>

            <div class="d-flex gap-2 justify-content-end">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">
                <i class="bi bi-save me-2"></i> Guardar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Script de sesión / logout del menú -->
  <script defer src="/js/pages/cuenta-inline-1.js"></script>

  <!-- Prefill de datos de usuario (desde sessionStorage) -->
  <script defer src="/js/pages/cuenta-inline-2.js"></script>

  <!-- UI helpers (menú principal) -->
  <script defer src="/js/pages/cuenta-inline-3.js"></script>

  <!-- DIRECCIONES + MODAL (solo ciudad) -->
  <script defer src="/js/pages/cuenta-inline-4.js"></script>



  <!-- Para cuando ya tenga foto de perfil -->
  <script defer src="/js/pages/cuenta-inline-5.js"></script>

  <!-- Redirección si no hay sesión -->
  <script defer src="/js/pages/cuenta-inline-6.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Guardas de ruta simples -->
  <script defer src="/js/pages/cuenta-inline-7.js"></script>

  <!--  MÉTODOS DE PAGO: Lógica de UI-->
  <script defer src="/js/pages/cuenta-inline-8.js"></script>
    <script defer src="/js/pages/cuenta-inline-9.js"></script>


  <script defer src="/js/pages/cuenta-inline-10.js"></script>
<script defer src="/js/pages/cuenta-events.js"></script>
</body>
</html>
