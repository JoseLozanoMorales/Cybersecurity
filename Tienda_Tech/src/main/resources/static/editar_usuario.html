<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar usuario - TiendaTech</title>

  <!-- Styles -->
  <!-- <link rel="stylesheet" href="style2.css" /> -->
  <link id="themeStylesheet" rel="stylesheet"
  href="css/styleClaroMenu.css" data-light="css/styleClaroMenu.css"
  data-dark="css/styleOscuroMenu.css" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Menú / sesión -->
  <script src="/js/auth-menu.js?v=4" defer></script>
  <link rel="stylesheet" href="/css/csp-static.css">
  <link rel="stylesheet" href="/css/csp-runtime.css">
  <script src="/js/csp-style-runtime.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">TiendaTech</div>
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Buscar..." />
    </div>
    <button class="menu-toggle" data-csp-handler-click="csp-editar_usuario-1">☰</button>
    <!-- Modo oscuro -->
    <button id="themeToggle" class="theme-toggle"
            type="button" aria-pressed="false">
      <span class="ico">🌙</span><span class="txt">Oscuro</span>
    </button>
  </header>

  <!-- Overlay -->
  <div class="overlay" id="overlay" data-csp-handler-click="csp-editar_usuario-2"></div>

  <!-- Menú Hamburguesa -->
  <nav class="hamburger-menu" id="hamburgerMenu">
    <button class="menu-close" data-csp-handler-click="csp-editar_usuario-3">✕</button>
    <a href="index.html" class="menu-item">Inicio</a>
    <a href="cuenta.html" class="menu-item">Cuenta</a>
    <a href="Carrito.html" class="menu-item">Carrito</a>
    <a href="#" class="menu-item">Cerrar sesión</a>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <!-- Back button -->
    <div class="back-button-container">
      <button class="btn btn-link btn-back p-0" data-csp-handler-click="csp-editar_usuario-4">
        <i class="bi bi-arrow-left fs-4"></i>
      </button>
    </div>

    <h2 class="form-title">Editar datos de usuario</h2>

  <!-- Imagencita actualizate porfis -->
  <div class="text-center mb-4">
    <div id="avatarEdit" class="profile-image" role="button" title="Haz clic para cambiar la foto">
      <img id="avatar-edit" alt="Foto de perfil"
          / class="csp-s-d812f7ce3398">
    </div>
    <input type="file" id="avatarFile" accept="image/*" hidden />
    <small class="text-muted">Haz clic para cambiar la foto</small>
  </div>


    <!-- User Form -->
    <form id="editUserForm" method="post" novalidate>
      <input type="hidden" id="usuarioId" />
      <div class="row g-3">
        <!-- Nombre - Full width -->
        <div class="col-12">
          <label class="form-label required" for="nombre">Nombre</label>
          <input type="text" class="form-control" id="nombre" name="nombre" required />
          <div class="invalid-feedback">Por favor, ingresa el nombre.</div>
        </div>

        <!-- Usuario y Correo -->
        <div class="col-12 col-md-6">
          <label class="form-label" for="usuario">Usuario</label>
          <input type="text" class="form-control" id="usuario" name="usuario" />
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label required" for="correo">Correo electrónico</label>
          <input type="email" class="form-control" id="correo" name="correo" required />
          <div class="invalid-feedback">Por favor, ingresa un correo electrónico válido.</div>
        </div>

        <!-- Contraseña y repetir -->
        <div class="col-12 col-md-6">
          <label class="form-label" for="contrasena">Contraseña</label>
          <div class="input-group">
            <input type="password" class="form-control" id="contrasena" name="contrasena" />
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <label class="form-label" for="repetirContrasena">Repetir contraseña</label>
          <input type="password" class="form-control" id="repetirContrasena" name="repetirContrasena" />
          <div class="invalid-feedback">Las contraseñas no coinciden.</div>
        </div>

        <!-- Teléfono -->
        <div class="col-12 col-md-6">
          <label class="form-label" for="telefono">Número de teléfono</label>
          <input type="tel" class="form-control" id="telefono" name="telefono" pattern="[0-9]{10}" />
          <div class="invalid-feedback">Por favor, ingresa un número de teléfono válido (10 dígitos).</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="row mt-4">
        <div class="col-12 col-md-6">
          <button type="submit" class="save-btn">
            <i class="bi bi-check-circle me-1"></i> Guardar cambios
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-nav">
      <a href="index.html" class="active">Inicio</a>
      <a href="cuenta.html">Cuenta</a>
      <a href="Carrito.html">Carrito</a>
    </nav>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

  <!-- Utilidades UI (menú, foto, toggle password) -->
  <script src="/js/pages/editar_usuario-inline-1.js"></script>

  <!-- Lógica de edición (Opción A: PUT /api/usuarios/cliente/{id}) -->
  <script src="/js/pages/editar_usuario-inline-2.js"></script>
    <script src="/js/pages/editar_usuario-inline-3.js"></script>
<script src="/js/pages/editar_usuario-events.js"></script>
</body>
</html>
