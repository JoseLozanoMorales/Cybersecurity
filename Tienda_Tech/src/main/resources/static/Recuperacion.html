<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recuperar contraseña</title>

    <link rel="stylesheet" href="css/style.css"/>
    <script src="/js/auth-menu.js?v=8" defer></script>
    <script src="/js/role-utils.js" defer></script>
  <link rel="stylesheet" href="/css/csp-static.css">
  <link rel="stylesheet" href="/css/csp-runtime.css">
  <script src="/js/csp-style-runtime.js"></script>
</head>
<body>
<div class="container">
    <div class="left-section">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <div class="right-section">
        <div class="login-container">
            <h1 class="welcome-text">Recuperar contraseña</h1>
            <p class="csp-s-7953a2c13eab">Ingresa tu correo para enviarte una contraseña temporal.</p>

            <form id="recoverForm" autocomplete="on">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input
                            type="email"
                            id="correo"
                            class="form-input"
                            placeholder="tucorreo@ejemplo.com"
                            required
                            autofocus
                            inputmode="email"
                            autocomplete="email"
                            autocapitalize="off"
                            spellcheck="false"
                    />
                </div>

                <button type="submit" class="login-button" id="btnEnviar" aria-live="polite">Enviar</button>
                <div class="csp-s-99ab7011cea0"></div>
            </form>

            <div class="footer-links csp-s-5b5914ddd58d">
                <div><a href="Login.html">¿Recordaste tu contraseña? Inicia sesión</a></div>
            </div>
        </div>
    </div>
</div>

<!-- ================== SCRIPT 1: UI/animaciones/mensajes ================== -->
<script src="/js/pages/recuperacion-inline-1.js"></script>

<!-- ============== SCRIPT 2: lógica de envío/llamada al backend ============== -->
<script src="/js/pages/recuperacion-inline-2.js"></script>
</body>
</html>
